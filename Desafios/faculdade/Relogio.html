<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pausa Programada</title>
    <style>
        body {
            background-color: #94eefa85;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            margin: 0;
            gap: 20px; 
        }

        .clock {
            font-size: 90px;
            background-color: #21a2ec9c;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.5);
            transition: all 0.3s; 
        }

       

        
        @keyframes blink {
            0%, 100% { 
                background-color: #21a2ec9c; 
                color: #000; 
            }
            50% { 
                background-color: #ff0000; 
                color: #fff; 
            }
        }

        
        .alerta-ativo {
            
            animation: blink 0.5s step-end infinite; 
        }

        
        .controls button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin: 0 12px;
            border: none;
            border-radius: 10px;
            transition: background-color 0.3s;
        }

        #start-btn {
            background-color: #4CAF50; 
            color: white;
        }
        
        #start-btn:hover {
            background-color: #45a049;
        }

        #stop-btn {
            background-color: #f44336; 
            color: white;
        }
        
        #stop-btn:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>
    <div class="clock" id="clock-container">
        <div id="time">
            </div>
    </div>
    
    <div class="controls">
        <button id="start-btn" onclick="iniciarAlerta()">Iniciar Alerta (15 min)</button>
        <button id="stop-btn" onclick="pararAlerta()">Parar Alerta</button>
    </div>

    <script>
        
        let idIntervalo = null; 
        const clockContainer = document.getElementById('clock-container'); 

        
        function updateTime() {
            const timeElement = document.getElementById('time');
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const timeString = `${hours}:${minutes}:${seconds}`;
            timeElement.textContent = timeString;
        }

        setInterval(updateTime, 1000); 
        updateTime();


        function iniciarAlerta() {
            if (idIntervalo) {
                alert("O alerta já está ativo!");
                return;
            }

            idIntervalo = setInterval(function() {
                alert("Levante-se Agora!");
                
               
                clockContainer.classList.add('alerta-ativo');

            }, 900000);

            alert("Alerta programado para disparar a cada 15 minutos.");
        }

        function pararAlerta() {
            if (idIntervalo) {
                clearInterval(idIntervalo);
                idIntervalo = null;
                alert("Pode voltar ao trabalho. Alerta desativado.");
                
               
                clockContainer.classList.remove('alerta-ativo');
            } else {
                alert("O alerta não está ativo para ser parado.");
            }
        } 
    </script>
</body>
</html>
